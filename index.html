<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060910" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#060910" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Orçamento</title>
    <script>
      // Aplica o tema ANTES do render pra não piscar. Escuro é o padrão; claro só
      // se o usuário escolheu (mesma regra de src/lib/tema.ts).
      var escuro = true
      try {
        escuro = localStorage.getItem('orcamento:tema') !== 'claro'
      } catch (e) {}
      if (escuro) document.documentElement.classList.add('dark')
      else {
        var ms = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < ms.length; i++) ms[i].setAttribute('content', '#f4f6f9')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
